<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSV作成ツール - 暗記帳</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap wide">
  <div class="bar2"><a class="lk" href="index.html" style="text-decoration:none">← 暗記帳に戻る</a><a class="lk" href="csv-guide.html" style="text-decoration:none">書き方</a></div>
  <h2>CSV作成ツール</h2>
  <div class="card"><h3>装飾（文字を選択してから押す）</h3>
    <div class="btns" style="flex-wrap:wrap"><button class="btn ghost" data-w="**" style="width:auto;flex:1"><b>太字</b></button><button class="btn ghost" data-w="*_" style="width:auto;flex:1"><u>下線</u></button><button class="btn ghost" data-w="***_" style="width:auto;flex:1"><b><u>両方</u></b></button></div>
    <div id="prev" class="hint" style="text-align:left">（入力欄を選ぶとプレビューが出ます）</div>
    <div id="dup" class="hint" style="text-align:left"></div></div>
  <div class="card">
    <div class="erow ehead" style="font-size:12px;color:var(--sub)"><span>問題</span><span>答え</span><span>メモ（任意）</span><span style="width:36px"></span></div>
    <div id="rows"></div>
    <div class="btns"><button class="btn ghost" id="addC">＋ 問題を追加</button><button class="btn ghost" id="addS">＋ セクションを追加</button></div>
  </div>
  <div class="card"><h3>ファイル</h3>
    <select id="libSel" style="margin-bottom:8px"></select>
    <input type="text" id="fname" value="words.csv" aria-label="ファイル名">
    <div class="btns" style="margin-top:8px"><button class="btn" id="dl">CSVをダウンロード</button>
    <label class="btn ghost">既存CSVを読み込む<input type="file" id="imp" accept=".csv,.txt" hidden></label></div>
    <button class="lk" id="clr" style="margin-top:6px">全部消す</button>
  </div>
  <p class="hint">入力内容はこのブラウザに自動保存されます。</p>
</div>
<script src="common.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=t=>esc(t).replace(/\*_(.+?)_\*/g,'<u>$1</u>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
let lastIn=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=S.get('editor',[{t:'s',q:'はじめ'},{t:'c',q:'',a:'',m:''}]);
const save=()=>S.set('editor',rows);
function render(){setTimeout(chk,0);$('rows').innerHTML=rows.map((r,i)=>r.t=='s'
 ?`<div class="erow sec"><b>#</b><input data-i="${i}" data-k="q" value="${esc(r.q)}" placeholder="セクション名"><span class="ebt"><button class="lk" data-u="${i}" aria-label="上へ">↑</button><button class="lk" data-v="${i}" aria-label="下へ">↓</button><button class="lk" data-d="${i}" aria-label="削除">✕</button></span></div>`
 :`<div class="erow c" data-i="${i}"><input data-i="${i}" data-k="q" value="${esc(r.q)}" placeholder="問題"><input data-i="${i}" data-k="a" value="${esc(r.a)}" placeholder="答え"><input data-i="${i}" data-k="m" value="${esc(r.m)}" placeholder="メモ"><span class="ebt"><button class="lk" data-u="${i}" aria-label="上へ">↑</button><button class="lk" data-v="${i}" aria-label="下へ">↓</button><button class="lk" data-d="${i}" aria-label="削除">✕</button></span></div>`).join('')}
$('rows').oninput=e=>{const d=e.target.dataset;if(d.i==null)return;rows[d.i][d.k]=e.target.value;save();chk();prev(d.i)};
$('rows').onclick=e=>{const d=e.target.dataset;let i;
  if(d.d!=null)rows.splice(+d.d,1);
  else if(d.u!=null&&+d.u>0){i=+d.u;[rows[i-1],rows[i]]=[rows[i],rows[i-1]]}
  else if(d.v!=null&&+d.v<rows.length-1){i=+d.v;[rows[i+1],rows[i]]=[rows[i],rows[i+1]]}
  else return;save();render()};
function add(r){rows.push(r);save();render();const els=$('rows').querySelectorAll('input');els[els.length-(r.t=='s'?1:3)].focus()}
$('addC').onclick=()=>add({t:'c',q:'',a:'',m:''});$('addS').onclick=()=>add({t:'s',q:''});
$('dl').onclick=()=>{const out=[];rows.forEach(r=>{if(r.t=='s')out.push(['#'+r.q.trim()]);else if(r.q.trim()||r.a.trim())out.push(r.m.trim()?[r.q.trim(),r.a.trim(),r.m.trim()]:[r.q.trim(),r.a.trim()])});
 let n=$('fname').value.trim()||'words.csv';if(!/\.csv$/i.test(n))n+='.csv';download(n,toCSV(out))};
function loadText(t,name){rows=parseCSV(t).filter(r=>(r[0]||'').trim()||(r[1]||'').trim()).map(r=>{const a=(r[0]||'').trim();return a.startsWith('#')?{t:'s',q:a.slice(1).trim()}:{t:'c',q:a,a:(r[1]||'').trim(),m:(r[2]||'').trim()}});$('fname').value=name;save();render()}
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;loadText(await f.text(),f.name);e.target.value=''};
const L=S.get('lib',[]);$('libSel').innerHTML='<option value="">履歴・お気に入りから読み込む…</option>'+L.map((x,i)=>`<option value="${i}">${x.fav?'★ ':''}${esc(x.name)}</option>`).join('');
$('libSel').onchange=e=>{const x=L[+e.target.value];if(x&&confirm('現在の編集内容を置き換えますか？'))loadText(x.text,x.name);e.target.value=''};
function prev(i){const r=rows[i];if(!r)return;$('prev').innerHTML=r.t=='s'?`<b>#${esc(r.q)}</b>`:`${fmt(r.q)} → ${fmt(r.a)}${r.m?' <small>（'+fmt(r.m)+'）</small>':''}`}
function chk(){const m={};rows.forEach(r=>{const q=r.t=='c'&&r.q.trim();if(q)m[q]=(m[q]||0)+1});let n=0;document.querySelectorAll('#rows .erow.c').forEach(el=>{const q=rows[el.dataset.i].q.trim(),d=q&&m[q]>1;el.classList.toggle('dup',!!d);if(d)n++});$('dup').textContent=n?`⚠ 同じ問題が重複しています（${n}行・赤枠）`:'重複なし'}
$('rows').addEventListener('focusin',e=>{if(e.target.dataset.i!=null){lastIn=e.target;prev(e.target.dataset.i)}});
document.querySelectorAll('[data-w]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const el=lastIn;if(!el)return alert('入力欄を選んでから押してください');const s=el.selectionStart,t=el.selectionEnd;if(s==t)return alert('装飾したい文字を選択してから押してください');const w=b.dataset.w,c={'**':'**','*_':'_*','***_':'_***'}[w],v=el.value;el.value=v.slice(0,s)+w+v.slice(s,t)+c+v.slice(t);rows[el.dataset.i][el.dataset.k]=el.value;save();prev(el.dataset.i)}});
$('clr').onclick=()=>{if(confirm('入力内容をすべて消しますか？')){rows=[{t:'c',q:'',a:'',m:''}];save();render()}};
render();chk();
</script>
</body>
</html>
